#To run manually: go to your repo → Actions → Playwright Tests → Run workflow → choose your parameters → Run.

name: 🎭 Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: "test:master"
      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"
      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"
      runner:
        description: "Where to run (self-hosted = your PC, needed for @api tests)"
        type: choice
        options:
          - github-hosted
          - self-hosted
        default: "github-hosted"

jobs:
  test:
    timeout-minutes: 60
    # push / pull_request -> GitHub-hosted (no setup needed, @api tests skipped)
    # manual run + runner=self-hosted -> your PC (runner must be Idle/online)
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJSON('["self-hosted","Windows","X64"]') || 'windows-latest' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browser
        shell: pwsh
        run: npx playwright install ${{ github.event.inputs.browser || 'chromium' }}

      # Diagnostic: shows exactly what the API returns to the GitHub runner.
      # Change the URL if your API_BASE_URL is different. Safe to delete later.
      - name: 🔍 Check API reachability from runner
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://fakestoreapi.com/carts"
          $ua  = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          foreach ($case in @("no-user-agent", "browser-user-agent")) {
            Write-Host "---- $case ----"
            if ($case -eq "no-user-agent") {
              $r = Invoke-WebRequest -Uri $url -SkipHttpErrorCheck
            } else {
              $r = Invoke-WebRequest -Uri $url -SkipHttpErrorCheck -UserAgent $ua -Headers @{ Accept = "application/json" }
            }
            Write-Host "Status : $($r.StatusCode)"
            Write-Host "Server : $($r.Headers['Server'])"
            Write-Host "CF-Ray : $($r.Headers['CF-Ray'])"
            $body = [string]$r.Content
            Write-Host "Body   : $($body.Substring(0, [Math]::Min(300, $body.Length)))"
          }

      - name: 🧪 Run Playwright Tests
        shell: pwsh
        run: |
          $suite = "${{ github.event.inputs.test_suite || 'test:master' }}"
          $browser = "${{ github.event.inputs.browser || 'chromium' }}"
          $mode = "${{ github.event.inputs.mode || 'headless' }}"
          $tag = $suite -replace 'test:', ''
          if ($tag -eq 'e2e') { $tag = 'end-to-end' }
          $pwArgs = @("--grep", "@$tag", "--project=$browser", "--output=test-results", "--pass-with-no-tests")
          # fakestoreapi.com (Cloudflare) blocks GitHub-hosted runner IPs with a 403 challenge,
          # so @api tests are skipped there. On a self-hosted runner (your PC) they run normally.
          # Selecting test:api on GitHub-hosted still runs them, so the failure stays visible.
          if ($tag -ne 'api' -and $env:RUNNER_ENVIRONMENT -eq 'github-hosted') {
            $pwArgs += @("--grep-invert", "@api")
            Write-Host "NOTE: @api tests are skipped on GitHub-hosted runner (Cloudflare blocks fakestoreapi.com)."
          }
          if ($mode -eq 'headed') { $pwArgs += "--headed" }
          npx playwright test @pwArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CI: "1"

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 30

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report
          path: custom-report/
          retention-days: 30

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: 🧪 Upload Reporting Labs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-labs-report
          path: reporting-labs/
          if-no-files-found: warn
          retention-days: 30

      - name: 🧾 Upload Test Results (traces, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7